<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collage Facce</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #bg-layer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 736px;
      height: 1104px;
    }
    #bg-layer img {
      width: 100%;
      height: 100%;
      display: block;
      animation: colorMorph 3s ease-in-out infinite;
    }
    @keyframes colorMorph {
      0%   { filter: hue-rotate(0deg) saturate(1); }
      25%  { filter: hue-rotate(90deg) saturate(1.6); }
      50%  { filter: hue-rotate(180deg) saturate(0.7); }
      75%  { filter: hue-rotate(270deg) saturate(1.6); }
      100% { filter: hue-rotate(360deg) saturate(1); }
    }
    canvas {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
<div id="bg-layer"><img src="assets/sfondo.png"></div>
<script>
let occhiSx = [], occhiDx = [], nasi = [], bocche = [], capelli = [], orecchie = [];

function preload() {
  for (let i = 1; i <= 5; i++) {
    occhiSx.push(loadImage(`assets/occhio-sx${i}.png`));
    occhiDx.push(loadImage(`assets/occhio-dx${i}.png`));
    nasi.push(loadImage(`assets/naso${i}.png`));
    bocche.push(loadImage(`assets/bocca${i}.png`));
    capelli.push(loadImage(`assets/capelli${i}.png`));
    orecchie.push(loadImage(`assets/orecchie${i}.png`));
  }
}

let lastChange = 0;
const INTERVAL = 500;

let current = { occhioSx: 0, occhioDx: 0, naso: 0, bocca: 0, capelli: 0, orecchie: 0 };

function setup() {
  let c = createCanvas(736, 1104);
  c.elt.style.background = 'transparent';
  clear();
  randomFace();
  lastChange = millis();
}

function draw() {
  clear();
  drawFace();

  if (millis() - lastChange > INTERVAL) {
    randomFace();
    lastChange = millis();
  }
}

function randomIndex(prev, max) {
  let next;
  do { next = floor(random(max)); } while (next === prev);
  return next;
}

function randomFace() {
  current.occhioSx = randomIndex(current.occhioSx, occhiSx.length);
  current.occhioDx = randomIndex(current.occhioDx, occhiDx.length);
  current.naso = randomIndex(current.naso, nasi.length);
  current.bocca = randomIndex(current.bocca, bocche.length);
  current.capelli = randomIndex(current.capelli, capelli.length);
  current.orecchie = randomIndex(current.orecchie, orecchie.length);
}

function drawFace() {
  image(capelli[current.capelli], 0, 0);
  image(orecchie[current.orecchie], 0, 0);
  image(occhiSx[current.occhioSx], 0, 0);
  image(occhiDx[current.occhioDx], 0, 0);
  image(nasi[current.naso], 0, 0);
  image(bocche[current.bocca], 0, 0);
}
</script>
</body>
</html>
